akka {
  http {
    server {
      default-http-port = 8000
    }
  }

  actor {
    provider = "local"
  }

  http.server.enable-http2 = on

  projection.grpc.consumer {
    client {
      host = "127.0.0.1"
      host = ${?SENDER_GRPC_HOST}
      port = 8080
      port = ${?SENDER_GRPC_PORT}
      use-tls = false
    }
    stream-id = "send_echo"
  }

  persistence {
    journal.plugin = "akka.persistence.r2dbc.journal"
    r2dbc {
      connection-factory = ${akka.persistence.r2dbc.postgres}
      connection-factory {
        host = "localhost"
        port = 5432
        database = "postgres"
        user = "postgres"
        password = "postgres"
      }
    }
  }

  projection.grpc.producer.query-plugin-id = "akka.persistence.r2dbc.query"
}