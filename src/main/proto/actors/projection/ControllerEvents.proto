syntax = "proto3";
package actors.projection;

option java_multiple_files = true;

service EventsByTag {
  rpc StreamedEvents (StreamedRequest) returns (stream StreamedEvent);
}

message StreamedRequest {
  string tag = 1;
  string offset = 2;
}

message StreamedEvent {
  string persistence_id = 1;
  string event_payload = 2;
  string offset = 3;
}
