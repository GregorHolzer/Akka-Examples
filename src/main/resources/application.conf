akka{
    http{
        server {
            default-http-port = 8000
        }
    }

    actor{
        provider = "cluster"
    }

    remote.artery{
        enabled = on
        transport = tcp
        canonical.hostname = "127.0.0.1"
        canonical.port = 2551
    }

    cluster{
        seed-nodes = [
            "akka://RailWayCrossing@127.0.0.1:2551"
        ]
        downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    }

    management{
        http{
            hostname = "127.0.0.1"
            port = 8558
        }
    }
    cluster.http.management {
       route-providers-read-only = false
    }
}