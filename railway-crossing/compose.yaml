configs:
  telegraf_config:
    file: ./telegraf.conf

services:
  influxdb:
    image: "influxdb:2"
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin
      - DOCKER_INFLUXDB_INIT_ORG=org
      - DOCKER_INFLUXDB_INIT_BUCKET=bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=bzO10KmR8x
    networks:
      - railway-crossing-net

  telegraf:
    image: "telegraf:latest"
    ports:
      - "4317:4317"
    configs:
      - source: telegraf_config
        target: /etc/telegraf/telegraf.conf
    networks:
      - railway-crossing-net

  nats-server:
    image: "nats"
    ports:
      - "4222:4222"
    networks:
      - railway-crossing-net

  akka-railway-service:
    image: "gregor2323/akka-railway-crossing-service:latest"
    pull_policy: always
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317
    networks:
      - railway-crossing-net

networks:
  railway-crossing-net:
    name: railway-crossing-net
    driver: bridge