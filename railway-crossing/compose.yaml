configs:
  telegraf_config:
    file: ./telegraf.conf

services:
  influxdb:
    image: "influxdb:2"
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin
      - DOCKER_INFLUXDB_INIT_ORG=org
      - DOCKER_INFLUXDB_INIT_BUCKET=bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=bzO10KmR8x

  telegraf:
    image: "telegraf:latest"
    ports:
      - "4317:4317"
    configs:
      - source: telegraf_config
        target: /etc/telegraf/telegraf.conf

  nats-server:
    image: "nats"
    ports:
      - "4222:4222"


  akka-railway-service:
    image: "gregor2323/akka-railway-crossing-service:latest"
    pull_policy: always
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317

  akka-seed-node:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: always
    environment:
      - NODE_ID=0
      - AKKA_ARTERY_HOST=akka-seed-node
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./configs/readMe/config.json:/config.json
    command:
      - /config.json


  akka-worker-1:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: always
    environment:
      - NODE_ID=1
      - AKKA_ARTERY_HOST=akka-worker-1
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./configs/readMe/config.json:/config.json
    command:
      - /config.json

  akka-worker-2:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: always
    environment:
      - NODE_ID=2
      - AKKA_ARTERY_HOST=akka-worker-2
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./configs/readMe/config.json:/config.json
    command:
      - /config.json


  akka-worker-3:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: always
    environment:
      - NODE_ID=3
      - AKKA_ARTERY_HOST=akka-worker-3
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./configs/readMe/config.json:/config.json
    command:
      - /config.json

  simulate-sensors:
    image: gregor2323/railway-crossing-signal-generator:latest
    pull_policy: never
    environment:
      - NATS_URL=nats-server:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317
      - MIN_SENSOR_INTERVAL=0.1
      - MAX_SENSOR_INTERVAL=0.1
      - MIN_TRAIN_SPEED_MS=150
      - MAX_TRAIN_SPEED_MS=150
      - DURATION_IN_SECONDS=60
      - PYTHONUNBUFFERED=1