configs:
  telegraf_config:
    file: ./telegraf.conf
    
services:
  influxdb:
    image: "influxdb:2"
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin
      - DOCKER_INFLUXDB_INIT_ORG=org
      - DOCKER_INFLUXDB_INIT_BUCKET=bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=bzO10KmR8x
      
  telegraf:
    image: "telegraf:latest"
    ports:
      - "4317:4317"
    configs:
      - source: telegraf_config
        target: /etc/telegraf/telegraf.conf

  railway-crossing-services:
    build:
      context: ./services/services
      dockerfile: ./Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317
      
  simulate-sensors:
    build:
      context: ./services/evaluation_generator
      dockerfile: ./Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317
      - MIN_EVENTS_PER_SEC=10.0
      - MAX_EVENTS_PER_SEC=100000.0
      - MIN_TRAIN_SPEED_MS=300.0
      - MAX_TRAIN_SPEED_MS=300.0
      - DURATION_IN_SECONDS=300
      - START_DELAY=15
      - PYTHONUNBUFFERED=1
    
  akka-seed-node:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: never
    environment:
      - NODE_ID=0
      - AKKA_ARTERY_HOST=akka-seed-node
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./measurements/config.json:/config.json
    command:
      - /config.json
  akka-worker-1:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: never
    environment:
      - NODE_ID=1
      - AKKA_ARTERY_HOST=akka-worker-1
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./measurements/config.json:/config.json
    command:
      - /config.json
  akka-worker-2:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: never
    environment:
      - NODE_ID=2
      - AKKA_ARTERY_HOST=akka-worker-2
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./measurements/config.json:/config.json
    command:
      - /config.json
  akka-worker-3:
    image: gregor2323/akka-railway-crossing-node:latest
    pull_policy: never
    environment:
      - NODE_ID=3
      - AKKA_ARTERY_HOST=akka-worker-3
      - AKKA_CLUSTER_SEED_NODE=akka://railway-crossing@akka-seed-node:2551
    volumes:
      - ./measurements/config.json:/config.json
    command:
      - /config.json
