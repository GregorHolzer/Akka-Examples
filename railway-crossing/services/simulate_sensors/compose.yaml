services:
  simulate-sensors:
    image: gregor2323/akka-simulate-sensors:latest
    pull_policy: always
    environment:
      - START_INTERVAL_IN_SECONDS=0.05
      - END_INTERVAL_IN_SECONDS=0.00005
      - NATS_URL=nats-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telegraf:4317

    networks:
      - railway-crossing_default
networks:
  railway-crossing_default:
    external: true
    name: railway-crossing_default