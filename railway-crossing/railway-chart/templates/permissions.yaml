# This template provides the permissions that are needed to form an Akka-Cluster within Kubernetes
#
# This template is inspired by the official Akka-Documentation:
#
# https://doc.akka.io/libraries/akka-management/current/kubernetes-deployment/forming-a-cluster.html
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akka-node
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: default
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "watch", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
subjects:
  - kind: ServiceAccount
    name: akka-node
    namespace: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
